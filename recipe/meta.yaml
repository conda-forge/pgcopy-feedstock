{% set name = "pgcopy" %}
{% set version = "1.6.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d1f83c39eb95ca77b93ef4a52d843651b60b9a876d054d6b48f7893867237189

build:
  number: 0
  noarch: python
  script: '{{ PYTHON }} -m pip install . -vv '

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - psycopg2
    - python >={{ python_min }}
    - pytz

test:
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
  imports:
    - pgcopy

about:
  home: https://pgcopy.readthedocs.io/en/latest/
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Fast db insert with postgresql binary copy
  dev_url: https://github.com/altaurog/pgcopy

extra:
  recipe-maintainers:
    - xhochy
