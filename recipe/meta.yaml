{% set name = "pgcopy" %}
{% set version = "1.6.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 07192bcbfb8655c516cbd070e849c4888b981343de6b385b477ff79d5b8ec914

build:
  number: 0
  noarch: python
  script: '{{ PYTHON }} -m pip install . -vv '

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - psycopg2
    - python >={{ python_min }}
    - pytz

test:
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
  imports:
    - pgcopy

about:
  home: https://pgcopy.readthedocs.io/en/latest/
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  summary: Fast db insert with postgresql binary copy
  dev_url: https://github.com/altaurog/pgcopy

extra:
  recipe-maintainers:
    - xhochy
